[palette]
# shades of gray and supporting colors
blackboard = "#181716"
metal = "#242628"
noir = "#2e2a27"
liquorice = "#383838"
ocean = "#0f3f4e"
elephant = "#88847f"
chalk = "#d3ccba"
lemon = "#ffef43"

# accent colors
strawberry = "#f56e7f"
cherry_blossom = "#e5a1a3"
lilac = "#bc96c7"
sky = "#92bbc9"
sour_apple = "#bec975"
honeycomb = "#dfcfa3"
creamsicle = "#f3b061"
salmon = "#f58669"

pink = "#ed83bb"
indigo = "#9c9de4"
cyan = "#7cbda1"
# green = "#78dd6c"
green = "#7ac973"
gray = "#73665b"
