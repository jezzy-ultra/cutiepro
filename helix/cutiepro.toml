"ui.statusline.select" = { bg = "sky", fg = "blackboard" }
"ui.statusline.separator" = { modifiers = ["bold"] }

"ui.bufferline" = { fg = "elephant" }
"ui.bufferline.active" = { fg = "cherry_blossom", underline.style = "line" }
"ui.bufferline.background" = { bg = "blackboard" }

"ui.popup" = { bg = "noir" }
"ui.popup.info" = { bg = "noir", fg = "creamsicle" }

# "ui.picker.header"
# "ui.picker.header.column"
"ui.picker.header.column.active" = { modifiers = ["bold"], underline = { color = "cherry_blossom", style = "line" } }

"ui.window" = "cherry_blossom"

"ui.help" = { fg = "honeycomb", bg = "noir" }

"ui.text" = "chalk"
"ui.text.focus" = { bg = "metal" }
"ui.text.inactive" = { fg = "elephant" }
"ui.text.info" = "honeycomb"
