"ui.text.directory" = "creamsicle"

"ui.virtual.ruler" = "elephant"
"ui.virtual.whitespace" = "elephant"
"ui.virtual.indent-guide" = "noir"
"ui.virtual.inlay-hint" = { fg = "gray", modifiers = ["italic"] }
# "ui.virtual.inlay-hint.parameter"
# "ui.virtual.inlay-hint.type"
"ui.virtual.wrap" = "elephant"
"ui.virtual.jump-label" = { fg = "lemon", modifiers = ["bold", "italic"] }

# FIXME
"ui.menu" = { bg = "noir" }
"ui.menu.selected" = { fg = "cherry_blossom", modifiers = ["bold"], underline = { color = "cherry_blossom", style = "line" } }
"ui.menu.scroll" = { bg = "noir", fg = "cherry_blossom" }

"ui.selection" = { bg = "liquorice" }
"ui.selection.primary" = { bg = "ocean" }

"ui.highlight" = { bg = "metal" }
