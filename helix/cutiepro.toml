"ui.linenr" = "elephant"
"ui.linenr.selected" = { fg = "cherry_blossom", modifiers = ["bold"] }

"ui.statusline" = { bg = "noir", fg = "chalk" }
"ui.statusline.inactive" = { modifiers = ["dim"] }
"ui.statusline.normal" = { bg = "cherry_blossom", fg = "blackboard" }
