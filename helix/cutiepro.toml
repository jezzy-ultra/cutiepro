"ui.background" = { bg = "blackboard" }
"ui.background.separator" = "cherry_blossom"

"ui.cursor" = { bg = "chalk", fg = "blackboard" }
# "ui.cursor.normal"
# "ui.cursor.insert"
# "ui.cursor.select"
"ui.cursor.match" = { fg = "lemon", modifiers = ["bold"], underline.style = "line" }
"ui.cursor.primary" = { fg = "blackboard" }
"ui.cursor.primary.normal" = { bg = "cherry_blossom", fg = "blackboard" }
"ui.cursor.primary.insert" = { bg = "sour_apple", fg = "blackboard" }
"ui.cursor.primary.select" = { bg = "sky", fg = "blackboard" }

