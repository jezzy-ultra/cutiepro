"attribute" = "creamsicle"

"type" = "salmon"
"type.builtin" = { fg = "salmon", modifiers = ["bold"] }
"type.enum.variant" = "cherry_blossom"

"constructor" = "pistachio"

"constant" = "sky"
"constant.character" = "cherry_blossom"
"constant.character.escape" = "sky"

"string" = "sour_apple"
"string.regexp" = "lilac"
"string.special" = "barbie"
"string.special.symbol" = "rose"

"comment" = "elephant"

"variable" = "cherry_blossom"
"variable.builtin" = { fg = "cherry_blossom", modifiers = ["bold"] }

"label" = "pistachio"

"punctuation" = "honeycomb"
"punctuation.special" = "barbie"

"keyword" = "rose"

"operator" = "lilac"

"function" = "lilac"
"function.builtin" = { fg = "lilac", modifiers = ["bold"] }

"tag" = "honeycomb"
"tag.builtin" = { fg = "honeycomb", modifiers = ["bold"] }

"namespace" = { fg = "creamsicle", modifiers = ["bold"] }

"special" = "barbie"

"markup.heading" = { fg = "cherry_blossom", underline = { color = "cherry_blossom", style = "dashed" } }
"markup.list" = "sky"
"markup.bold" = { fg = "honeycomb", modifiers = ["bold"] }
"markup.italic" = { fg = "honeycomb", modifiers = ["italic"] }
"markup.strikethrough" = { fg = "honeycomb", modifiers = ["crossed_out"] }
