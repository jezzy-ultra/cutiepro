"ui.cursorline.primary" = { bg = "metal" }
# "ui.cursorline.secondary"

"ui.cursorcolumn.primary" = { bg = "metal" }
# "ui.cursorcolumn.secondary"

"warning" = { bg = "noir", fg = "creamsicle" }
"error" = { bg = "noir", fg = "strawberry" }
"info" = { bg = "noir", fg = "lilac" }
"hint" = { bg = "noir", fg = "chalk" }

"diagnostic" = { underline = { color = "chalk", style = "curl" } }
"diagnostic.hint" = { underline = { color = "chalk", style = "curl" } }
"diagnostic.info" = { underline = { color = "lilac", style = "curl" } }
"diagnostic.warning" = { underline = { color = "creamsicle", style = "curl" } }
"diagnostic.error" = { underline = { color = "strawberry", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

