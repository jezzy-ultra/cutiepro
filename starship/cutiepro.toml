[directory]
disabled = false
truncation_symbol = "…/"
read_only = "󰌾 "
home_symbol = "~"
# home_symbol = ' '
style = "bg:cherry_blossom fg:blackboard"
read_only_style = "bg:cherry_blossom fg:blackboard"
before_repo_root_style = "bg:cherry_blossom fg:soil"
repo_root_style = "bg:cherry_blossom fg:blackboard bold"
format = "[ ($read_only)$path ]($style)"
repo_root_format = "([$read_only]($read_only_style))[ $before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path ]($style)"
use_os_path_sep = true
# use_os_path_sep = false
truncation_length = 5

[directory.substitutions]
# '/' = '  '

[vcsh]
disabled = false
symbol = "🆅 "
style = "bg:honeycomb fg:blackboard"
format = "[ $symbol$repo ]($style)"

[git_branch]
disabled = false
symbol = " "
truncation_symbol = "…"
style = "bg:honeycomb fg:blackboard"
format = "[ $symbol$branch(:$remote_branch) ]($style)"
always_show_remote = false
only_attached = false
# truncation_length = 20

[git_commit]
disabled = false
tag_symbol = "  "
style = "bg:honeycomb fg:blackboard"
format = '[\($hash( $tag)\) ]($style)'
tag_disabled = false
only_detached = true
commit_hash_length = 7
tag_max_candidates = 0  # exact matches only

[git_state]
disabled = false
style = "bg:honeycomb fg:blackboard"
format = "[$state( $progress_current/$progress_total) ]($style)"
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"

[git_status]
disabled = false
style = "bg:honeycomb fg:blackboard bold"
format = '[\[$all_status$ahead_behind\] ]($style)'
conflicted = "=${count} "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = "🗸"
untracked = "?${count} "
stashed = "$${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "
typechanged = "↔ "
ignore_submodules = false
use_git_executable = false
# windows_starship = '/mnt/c/...'

[git_metrics]
disabled = false
# disabled = true
added_style = "bg:honeycomb fg:blackboard"
deleted_style = "bg:honeycomb fg:blackboard"
format = "(([+$added ]($added_style))([-$deleted ]($deleted_style)))"
only_nonzero_diffs = true
ignore_submodules = false

[hg_branch]
disabled = false
symbol = " "
style = "bg:honeycomb fg:blackboard"
format = "[ $symbol$branch(:$topic) ]($style)"
