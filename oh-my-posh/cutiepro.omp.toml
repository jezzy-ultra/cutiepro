"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
version = 3
terminal_background = "p:blackboard"
# console_title_template = '{{ .Shell }} in {{ .Folder }}'
# final_space = true
# shell_integration = true
# async = true
# patch_pwsh_bleed = true
# enable_cursor_positioning = true

[palette]
blackboard = "#181716"
strawberry = "#f56e7f"
sour_apple = "#bec975"
honeycomb = "#e8d6a7"
violet = "#bea2c6"
cherry_blossom = "#e5a1a3"
sky = "#92bbc9"
elephant = "#88847f"
soil = "#73665b"
salmon = "#f58669"
leaf = "#7ac973"
creamsicle = "#f3b061"
blueberry = "#9697e4"
princess = "#ed83bb"
pond = "#63c693"
chalk = "#d5d0c9"
metal = "#242628"
film = "#2e2a27"
ocean = "#0f3f4e"
concrete = "#383838"
lemon = "#ffef43"

[secondary_prompt]
foreground = "p:blackboard"
template = "→ "

# [transient_prompt]
# template = "<p:yellow,transparent></><,p:yellow> {{ .Folder }} </><p:yellow,transparent></> "
# foreground = "p:black"
# background = "transparent"

[[blocks]]
type = "prompt"
alignment = "left"
newline = true

[[blocks.segments]]
type = "os"
style = "diamond"
leading_diamond = "\ue0b6"
background = "p:strawberry"
foreground = "p:blackboard"
template = "{{ if .WSL }} wsl: {{ end }}<b>{{ .Icon }}</b> "

[[blocks.segments]]
type = "session"
style = "diamond"
trailing_diamond = "\ue0b0"
background = "p:strawberry"
foreground = "p:blackboard"
templates = [
  "\ue0b1 ",
  "{{ if .Root }}\uedcc  <b><i>{{ .UserName }}</b></i>{{ else }}\uf007 {{ .UserName }}{{ end }}{{ if .SSHSession }}@{{ .HostName }}{{ end }} ",
]

[[blocks.segments]]
type = "path"
style = "diamond"
leading_diamond = "\ue0d7"
trailing_diamond = "\ue0b0"
background = "p:cherry_blossom"
foreground = "p:blackboard"
template = """ {{ $git := .Segments.Git }}{{ if $git.Dir }}{{ if $git.UpstreamURL }}{{ url $git.UpstreamIcon $git.UpstreamURL }} {{ else }}\U000f02a2 {{ end }}<b>{{ $git.RepoName }}</b>{{ if ne $git.RepoName .Path }}{{ regexReplaceAll "(?:\ue0b1.*)+(( \ue0b1[^\ue0b1]*){3})$" (trimPrefix $git.Dir .PWD | replace "/" " \ue0b1 ") "\ue0b1 …$1" }}{{ end }}{{ else }}{{ .Path }}{{ end }}{{ if not .Writable }} \uf023{{ end }} """

[blocks.segments.properties]
style = "agnoster_short"
max_depth = 3
folder_separator_icon = " \ue0b1 "
home_icon = "\uf015 "
folder_icon = "…"
display_root = true
gitdir_format = "<b>%s</b>"

[blocks.segments.properties.mapped_locations]
'/' = "\ue216"

[[blocks.segments]]
type = "git"
style = "diamond"
leading_diamond = "\ue0d7"
trailing_diamond = "\ue0b0"
background = "p:honeycomb"
foreground = "p:blackboard"
template = " {{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} \ue0b1 \uf044 {{ .Working.String }}{{ end }}{{ if .Staging.Changed }} \ue0b1 \uf046 {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} \ue0b1 \uf0c7 {{ .StashCount }}{{ end }} "

[blocks.segments.properties]
fetch_status = true
fetch_upstream_icon = true
commit_icon = "\uf417 "
tag_icon = "\uf412 "
no_commits_icon = "\U000f0095"

[[blocks.segments]]
type = "fossil"
style = "diamond"
leading_diamond = "\ue0d7"
trailing_diamond = "\ue0b0"
background = "p:honeycomb"
foreground = "p:blackboard"
template = " \ue0a0{{ .Branch }}{{ if .Status.Changed }} \ue0b1 {{ .Status.String }}{{ end }} "

[[blocks.segments]]
type = "jujutsu"
style = "diamond"
leading_diamond = "\ue0d7"
trailing_diamond = "\ue0b0"
background = "p:honeycomb"
foreground = "p:blackboard"
template = " {{ .ChangeID }}{{ if .Working.Changed }} \ue0b1 {{ .Working.String }}{{ end }} "

[blocks.segments.properties]
fetch_status = true

[[blocks.segments]]
type = "mercurial"
style = "diamond"
leading_diamond = "\ue0d7"
trailing_diamond = "\ue0b0"
background = "p:honeycomb"
foreground = "p:blackboard"
template = " \ue0a0{{ .Branch }}{{ if .LocalCommitNumber }} ({{ .LocalCommitNumber }}:{{ .ChangeSetIDShort }}){{ end }}{{ range .Bookmarks }} \uf02e {{ . }}{{ end }}{{ range .Tags }} \uf02b {{ . }}{{ end }}{{ if .Working.Changed }} \uf044 {{ .Working.String }}{{ end }} "

[blocks.segments.properties]
fetch_status = true

[[blocks.segments]]
type = "plastic"
style = "diamond"
leading_diamond = "\ue0d7"
trailing_diamond = "\ue0b0"
background = "p:honeycomb"
foreground = "p:blackboard"
template = " {{ .Selector }}{{ if .Status.Changed }} \uf044 {{ end }}{{ .Status.String }} "

[blocks.segments.properties]
fetch_status = true

[[blocks.segments]]
type = "sapling"
style = "diamond"
leading_diamond = "\ue0d7"
trailing_diamond = "\ue0b0"
background = "p:honeycomb"
foreground = "p:blackboard"
template = " {{ if .Bookmark }}\uf02e {{ .Bookmark }}*{{ else }}\ue729 {{ .ShortHash }}{{ end }}{{ if .Working.Changed }} \uf044 {{ .Working.String }}{{ end }} "

[[blocks.segments]]
type = "svn"
style = "diamond"
leading_diamond = "\ue0d7"
trailing_diamond = "\ue0b0"
background = "p:honeycomb"
foreground = "p:blackboard"
template = " \ue0a0{{ .Branch }}{{ if .BaseRev }} r{{ .BaseRev }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }} "

[blocks.segments.properties]
fetch_status = true

